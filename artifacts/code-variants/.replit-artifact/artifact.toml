kind = "web"
previewPath = "/"
title = "Code Variants Studio"
version = "1.0.0"
id = "artifacts/code-variants"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20451

[services.development]
run = "pnpm --filter @workspace/code-variants run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/code-variants", "run", "build" ]
publicDir = "artifacts/code-variants/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20451"
BASE_PATH = "/"
